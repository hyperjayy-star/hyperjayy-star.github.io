<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Jaiden Ortiz — Casting</title>
<meta name="description" content="Jaiden Ortiz model casting card and portfolio.">
<style>
:root{--bg:#080808;--paper:#f4f1ea;--muted:#aaa59d;--line:#ffffff25}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--paper);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
button,a{font:inherit;color:inherit}button{cursor:pointer}
body{overflow:hidden}
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#080808;transition:opacity .55s ease,visibility .55s ease}
.intro.done{opacity:0;visibility:hidden}
.intro-inner{text-align:center;transform:translateY(8px);animation:introRise .8s cubic-bezier(.2,.7,.2,1) both}
.intro-name{font-family:Georgia,serif;font-size:clamp(54px,10vw,150px);font-weight:400;letter-spacing:-.065em;line-height:.82;margin:0}
.intro-sub{margin-top:20px;font-size:10px;letter-spacing:.32em;color:#9c9891}
@keyframes introRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(8px)}}

#experience{position:relative;width:100%;height:100svh;overflow:hidden;background:
radial-gradient(circle at 50% 38%,#1b1b1b 0,#101010 43%,#080808 74%);touch-action:none}
.chrome{position:absolute;z-index:30;inset:0;pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(17px + env(safe-area-inset-top)) 22px 12px}
.jo{font-family:Georgia,serif;font-size:26px;letter-spacing:-.07em}
.mode{font-size:9px;letter-spacing:.24em;color:#8d8982}
.corner-portfolio{pointer-events:auto;border:1px solid #ffffff55;background:#0b0b0bbf;color:#fff;padding:10px 13px;font-size:9px;letter-spacing:.15em;backdrop-filter:blur(12px);opacity:0;transform:translateY(-9px);transition:.4s ease}
.corner-portfolio.show{opacity:1;transform:none}
.replay-card{pointer-events:auto;border:0;background:transparent;color:#aaa;padding:10px 0;font-size:9px;letter-spacing:.14em;opacity:0;transition:.35s ease}
.replay-card.show{opacity:1}
.deck{position:absolute;inset:0;perspective:1600px}
.slide{position:absolute;inset:0;display:grid;place-items:center;padding:78px 24px 68px;opacity:0;transform:translate3d(14%,0,0) rotateY(-4deg) scale(.975);filter:blur(2px);transition:transform .62s cubic-bezier(.16,.84,.22,1),opacity .42s ease,filter .42s ease;pointer-events:none}
.slide.before{transform:translate3d(-14%,0,0) rotateY(4deg) scale(.975)}
.slide.active{opacity:1;transform:none;filter:none;pointer-events:auto}
.card-shell{position:relative;display:grid;place-items:center;max-width:100%;max-height:100%}
.card-shell:after{content:"";position:absolute;inset:4% 4% -2%;background:#0008;filter:blur(45px);z-index:-1;border-radius:12px}
.slide img{display:block;max-width:min(96vw,1500px);max-height:calc(100svh - 150px);width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}

.edge-hint{position:absolute;z-index:24;top:50%;transform:translateY(-50%);width:42px;height:78px;display:grid;place-items:center;color:#ffffff52;font-size:24px;pointer-events:none}
.edge-hint.left{left:5px}.edge-hint.right{right:5px}
.progress{position:absolute;left:22px;right:22px;bottom:calc(19px + env(safe-area-inset-bottom));height:1px;background:#ffffff24;overflow:hidden}
.progress span{display:block;height:100%;width:33.333%;background:#eeeae0;transform:translateX(0);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.bottom-meta{position:absolute;z-index:25;left:22px;right:22px;bottom:calc(31px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:9px;letter-spacing:.18em;color:#8f8b84}
.full-prompt{position:absolute;z-index:27;left:50%;bottom:calc(62px + env(safe-area-inset-bottom));width:min(760px,calc(100vw - 28px));transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:.48s ease}
.full-prompt.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.prompt-box{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:20px 22px;background:#0a0a0ae8;border:1px solid #ffffff70;backdrop-filter:blur(14px)}
.prompt-copy{display:flex;flex-direction:column;gap:5px}
.prompt-kicker{font-size:9px;letter-spacing:.22em;color:#9f9a92}
.prompt-main{font-family:Georgia,serif;font-size:clamp(25px,3.5vw,42px);letter-spacing:-.035em;line-height:1}
.prompt-arrow{font-size:30px}
.tap-zones{position:absolute;inset:72px 0 52px;z-index:23;display:grid;grid-template-columns:1fr 1fr}
.tap-zone{background:transparent;border:0;outline:0}

#portfolio{display:none;position:relative;min-height:100svh;background:#0d0d0d;padding:calc(24px + env(safe-area-inset-top)) 22px calc(42px + env(safe-area-inset-bottom));overflow:auto}
#portfolio.open{display:block;animation:portfolioIn .62s cubic-bezier(.16,.84,.22,1) both}
@keyframes portfolioIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.portfolio-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px}
.portfolio-title{font-family:Georgia,serif;font-size:clamp(62px,9vw,120px);font-weight:400;letter-spacing:-.065em;margin:0;line-height:.82}
.portfolio-meta{display:flex;align-items:center;gap:18px}
.portfolio-count{font-size:9px;letter-spacing:.18em;color:#8f8a82}
.back-card{border:1px solid #444;background:#151515;color:#fff;padding:11px 13px;font-size:9px;letter-spacing:.14em}

/* Balanced portfolio: every tile is the same 2:3 size.
   Original photos only. Cropping is limited to slight side-trim on wider originals. */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gallery button{display:block;width:100%;aspect-ratio:2/3;border:0;padding:0;margin:0;background:#111;overflow:hidden;cursor:zoom-in}
.gallery img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transition:transform .28s ease,filter .28s ease}
.gallery button:nth-child(1) img{object-position:53% 50%}
.gallery button:hover img{transform:scale(1.006);filter:brightness(.95)}
.portfolio-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:26px;margin-top:38px;padding-top:20px;border-top:1px solid #303030}
.portfolio-foot-left{font-family:Georgia,serif;font-size:clamp(28px,3vw,44px);line-height:1;letter-spacing:-.035em}
.portfolio-foot-links{display:flex;flex-direction:column;align-items:flex-end;gap:12px;font-size:9px;letter-spacing:.14em;color:#b9b3aa}

@media(max-width:900px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
@media(max-width:700px){
 .topbar{padding-left:14px;padding-right:14px}
 .mode{display:none}
 .slide{padding:72px 9px 58px}
 .slide img{max-width:98vw;max-height:calc(100svh - 128px)}
 .bottom-meta{left:14px;right:14px;bottom:calc(26px + env(safe-area-inset-bottom))}
 .progress{left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom))}
 .full-prompt{bottom:calc(52px + env(safe-area-inset-bottom));width:calc(100vw - 20px)}
 .prompt-box{padding:17px 17px}
 .prompt-main{font-size:27px}
 .edge-hint{display:none}
 #portfolio{padding-left:10px;padding-right:10px}
 .portfolio-title{font-size:64px}
 .portfolio-count{display:none}
 .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .gallery button{margin:0}
 .portfolio-foot{flex-direction:column}
 .portfolio-foot-links{align-items:flex-start}
 .lb-prev,.lb-next{display:none}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

.lightbox{position:fixed;inset:0;z-index:150;background:#050505fb;display:none;align-items:center;justify-content:center;padding:18px;touch-action:none}
.lightbox.open{display:flex;animation:lbIn .24s ease both}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;user-select:none;-webkit-user-drag:none;animation:photoIn .32s cubic-bezier(.16,.84,.22,1)}
@keyframes photoIn{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:none}}
.lb-close{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));border:1px solid #444;background:#101010d9;color:#fff;width:44px;height:44px;font-size:26px}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #444;background:#111c;color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-count{position:absolute;bottom:calc(13px + env(safe-area-inset-bottom));font-size:9px;letter-spacing:.18em;color:#888}

@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
 .topbar{padding-left:14px;padding-right:14px}
 .mode{display:none}
 .slide{padding:72px 9px 58px}
 .slide img{max-width:98vw;max-height:calc(100svh - 128px)}
 .bottom-meta{left:14px;right:14px;bottom:calc(26px + env(safe-area-inset-bottom))}
 .progress{left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom))}
 .full-prompt{bottom:calc(52px + env(safe-area-inset-bottom));width:calc(100vw - 20px)}
 .prompt-box{padding:17px 17px}
 .prompt-main{font-size:27px}
 .edge-hint{display:none}
 #portfolio{padding-left:10px;padding-right:10px}
 .portfolio-title{font-size:64px}
 .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .gallery button{margin:0}
 .lb-prev,.lb-next{display:none}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

.agent-credit{
  position:absolute;z-index:28;left:22px;top:calc(64px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:9px;
  font-size:9px;letter-spacing:.14em;color:#c7c1b8;
  opacity:0;transform:translateY(-7px);pointer-events:none;
  transition:.4s ease;
}
.agent-credit.show{opacity:1;transform:none;pointer-events:auto}
.agent-credit .agent-name{color:#fff;border-bottom:1px solid #6b665f;padding-bottom:4px}
@media(max-width:700px){
  .agent-credit{left:14px;top:calc(58px + env(safe-area-inset-top));font-size:8px}
}

</style>
</head>

else { introTimer=setTimeout(hideIntro,1050); }

function showSlide(next){
  if(next<0) next=0;
  if(next>2){ openPortfolio(); return; }
  clearTimeout(promptTimer);
  fullPrompt.classList.remove('show');
  cornerPortfolio.classList.remove('show');
  replayCard.classList.remove('show');
  agentCredit.classList.remove('show');

  slides.forEach((s,i)=>{
    s.classList.remove('active','before');
    if(i<next) s.classList.add('before');
    if(i===next) s.classList.add('active');
  });
  index=next;
  counter.textContent=`0${index+1} / 03`;
  progressBar.style.transform=`translateX(${index*100}%)`;

  if(index===2){
    instruction.textContent='SWIPE LEFT OR CONTINUE TO PORTFOLIO';
    promptTimer=setTimeout(()=>{
      fullPrompt.classList.add('show');
      cornerPortfolio.classList.add('show');
      if(nfcEntry) replayCard.classList.add('show');
      agentCredit.classList.add('show');
    },650);
  } else {
    instruction.textContent='SWIPE OR TAP TO CONTINUE';
  }
}

function openPortfolio(){
  clearTimeout(promptTimer);
  experience.style.display='none';
  portfolio.classList.add('open');
  document.body.style.overflow='auto';
  window.scrollTo(0,0);
}
function backToCard(){
  portfolio.classList.remove('open');
  experience.style.display='block';
  document.body.style.overflow='hidden';
  showSlide(2);
}

document.getElementById('portfolioCta').addEventListener('click',openPortfolio);
cornerPortfolio.addEventListener('click',openPortfolio);
document.getElementById('backCard').addEventListener('click',backToCard);
replayCard.addEventListener('click',()=>{
  history.replaceState(null,'',location.pathname);
  showSlide(0);
});
document.getElementById('tapPrev').addEventListener('click',()=>showSlide(index-1));
document.getElementById('tapNext').addEventListener('click',()=>showSlide(index+1));

let sx=0,sy=0,st=0;
experience.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=performance.now();},{passive:true});
experience.addEventListener('pointerup',e=>{
  if(e.target.closest('button')) return;
  const dx=e.clientX-sx, dy=e.clientY-sy, dt=Math.max(1,performance.now()-st);
  const vx=Math.abs(dx)/dt;
  if(Math.abs(dx)>42 && Math.abs(dx)>Math.abs(dy) || vx>.65){
    if(dx<0) showSlide(index+1);
    else showSlide(index-1);
  }
},{passive:true});

document.addEventListener('keydown',e=>{
  if(experience.style.display!=='none'){
    if(e.key==='ArrowRight'||e.key===' ')showSlide(index+1);
    if(e.key==='ArrowLeft')showSlide(index-1);
  }
});

const galleryFiles=[...document.querySelectorAll('[data-gallery-index] img')].map(i=>i.src);
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbCount=document.getElementById('lbCount');
let gi=0,lsx=0,lsy=0;

function preloadAround(){
  [-1,1].forEach(d=>{const im=new Image();im.src=galleryFiles[(gi+d+galleryFiles.length)%galleryFiles.length];});
}
function showGallery(i){
  gi=(i+galleryFiles.length)%galleryFiles.length;
  lbImg.src=galleryFiles[gi];
  lbCount.textContent=`${gi+1} / ${galleryFiles.length}`;
  preloadAround();
}
function openGallery(i){
  showGallery(i);
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeGallery(){
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  document.body.style.overflow='auto';
}
document.querySelectorAll('[data-gallery-index]').forEach(b=>b.addEventListener('click',()=>openGallery(Number(b.dataset.galleryIndex))));
document.querySelector('.lb-close').addEventListener('click',closeGallery);
document.querySelector('.lb-prev').addEventListener('click',()=>showGallery(gi-1));
document.querySelector('.lb-next').addEventListener('click',()=>showGallery(gi+1));
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeGallery();});
lightbox.addEventListener('pointerdown',e=>{lsx=e.clientX;lsy=e.clientY;},{passive:true});
lightbox.addEventListener('pointerup',e=>{
  if(e.target.closest('button')) return;
  const dx=e.clientX-lsx,dy=e.clientY-lsy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))showGallery(gi+(dx<0?1:-1));
},{passive:true});
document.addEventListener('keydown',e=>{
  if(!lightbox.classList.contains('open'))return;
  if(e.key==='Escape')closeGallery();
  if(e.key==='ArrowLeft')showGallery(gi-1);
  if(e.key==='ArrowRight')showGallery(gi+1);
});
if(location.hash==='#portfolio'){ intro.classList.add('done'); openPortfolio(); }
else if(nfcEntry){ showSlide(2); }
else { showSlide(0); }
</script>
</body>
</html>
