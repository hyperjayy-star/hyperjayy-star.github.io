<style>
@font-face{font-family:Caslon;src:url('/media/fonts/libre-caslon-display.ttf') format('truetype');font-display:swap}
:root{--bg:#0b0b0b;--paper:#f4f0e8;--muted:#aaa49a;--line:#2d2d2d}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--paper);scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.nav{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 3vw;color:#f4f0e8;font-size:9px;letter-spacing:.16em}
.jo{font-family:Caslon,Georgia,serif;font-size:36px;letter-spacing:-.08em}
.nav-links{display:flex;gap:25px;align-items:center}
.hero{position:relative;height:100svh;min-height:700px;overflow:hidden}
.hero-image{position:absolute;inset:0}
.hero-image img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:brightness(.82)}
.hero-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002 35%,#0009 100%)}
.identity{position:absolute;z-index:3;left:3vw;bottom:7vh}
.kicker{font-size:9px;letter-spacing:.22em;margin:0 0 16px;color:#d6d0c7}
h1{font-family:Caslon,Georgia,serif;font-weight:400;font-size:clamp(92px,14vw,220px);line-height:.76;letter-spacing:-.065em;margin:0}
h1 span{display:block}h1 span:last-child{margin-left:5vw}
.hero-cta{display:inline-block;margin-top:34px;border-bottom:1px solid #ddd6cb;padding-bottom:7px;font-size:9px;letter-spacing:.17em}
.work{padding:8vh 2vw 10vh}
.work-head{display:flex;justify-content:space-between;align-items:center;padding:0 1vw 24px}
.work-title{font-family:Caslon,Georgia,serif;font-size:clamp(52px,7vw,105px);font-weight:400;letter-spacing:-.055em;margin:0}
.work-link{font-size:9px;letter-spacing:.15em}
.grid{columns:3;column-gap:10px}
.tile{display:block;break-inside:avoid;margin:0 0 10px;overflow:hidden;background:#111}
.tile img{width:100%;height:auto;display:block;transition:transform .3s ease}
.tile:hover img{transform:scale(1.012)}
.footer{border-top:1px solid var(--line);padding:24px 3vw 28px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;color:#aaa49a}
@media(max-width:850px){
 .nav{padding:17px 15px}.nav-links{gap:14px}.nav-links a:nth-child(2){display:none}
 .identity{left:16px;bottom:6vh}.kicker{font-size:8px}
 h1{font-size:clamp(88px,24vw,150px)}h1 span:last-child{margin-left:8vw}
 .work{padding-left:7px;padding-right:7px}.grid{columns:2;column-gap:7px}.tile{margin-bottom:7px}
 .work-head{padding-left:9px;padding-right:9px}.footer{padding-left:16px;padding-right:16px}
}
</style>
</head>
